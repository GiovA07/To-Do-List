{% extends 'tasks/base.html' %}

{% block title %}{{ task.title }} - Editar tarea{% endblock %}

{% block main_class %}edit-page{% endblock %}
{% block content %}
    <header class="header">
        <div>
            <h1 class="title">Editar tarea</h1>
            <p class="subtitle">Modificando los datos de la tarea seleccionada.</p>
        </div>
    </header>

    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn-primary">Guardar cambios</button>
        <a href="{% url 'tasks:detail' task.id %}" class="btn-secondary">Cancelar</a>
    </form>
{% endblock %}
