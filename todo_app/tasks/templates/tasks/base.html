{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}App de Tareas{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>
<body>
    <main class="container {% block main_class %}{% endblock %}">
        
        {% if user.is_authenticated %}
        <nav class="top-navbar">
            <span class="user-greeting">Hola, <strong>{{ user.username }}</strong></span>
            <a href="{% url 'tasks:logout' %}" class="btn-danger">Cerrar Sesión</a> 
        </nav>
        {% endif %}

        {% if messages %}
            <div class="mensajes-contenedor">
                {% for message in messages %}
                    <div class="alerta alerta-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}
        {% endblock %}

    </main>
</body>
</html>
