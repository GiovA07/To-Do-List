{% extends 'tasks/base.html' %}

{% block title %}Agregar Tarea – {{ task.title }}{% endblock %}

{% block content %}
    <header class="header">
        <div>
            <h1 class="title">Crear nueva tarea</h1>
            <p class="subtitle">Completá los datos y guardá tu tarea.</p>
        </div>
    </header>

    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn-primary">Guardar</button>
        <a href="{% url 'tasks:index' %}" class="btn-secondary">Cancelar</a>
    </form>
{% endblock %}
